<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Películas — Sonjaim</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Son<span>jaim</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="peliculas.html" class="active">Películas</a></li>
        <li><a href="colecciones.html">Colecciones</a></li>
        <li><a href="sobre.html">Sobre nosotros</a></li>
      </ul>
      <div class="nav-actions">
        <button class="search-btn" id="searchBtn" aria-label="Buscar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="search-overlay" id="searchOverlay">
    <form class="search-box" id="searchForm">
      <input type="text" id="searchInput" placeholder="Buscar películas, directores, géneros..." autocomplete="off">
      <button type="submit">Buscar</button>
      <button type="button" id="searchClose" style="background:#eee;color:#333;">✕</button>
    </form>
  </div>

  <div class="container">
    <h1 class="section-title">Todas las películas</h1>

    <!-- FILTROS -->
    <div class="filters">
      <div class="filter-group">
        <label for="filterSearch">Buscar</label>
        <input type="text" id="filterSearch" placeholder="Título, director...">
      </div>
      <div class="filter-group">
        <label for="filterYear">Año</label>
        <select id="filterYear">
          <option value="">Todos los años</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filterGenre">Género</label>
        <select id="filterGenre">
          <option value="">Todos los géneros</option>
        </select>
      </div>
      <button class="btn btn-outline" id="resetFilters">Limpiar filtros</button>
    </div>

    <!-- GRID DE PELÍCULAS (se llena con JS) -->
    <div class="movie-grid" id="movieGrid">
      <!-- Las tarjetas se generan dinámicamente -->
    </div>
  </div>

  <footer>
    <p>© 2026 Sonjaim · Proyecto personal</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
